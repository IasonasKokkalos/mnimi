[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnimi"
version = "3.0.0"
description = "Embeddable, local-first agent memory. One SQLite file, zero infra."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Iasonas Kokkalos", email = "iasonaskokkalos@gmail.com" }]
keywords = ["agent", "memory", "llm", "sqlite", "sqlite-vec", "vector-search", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]

# Core dependencies are deliberately minimal. Every entry here is a liability;
# the library must import and run with ONLY these two. See docs/DECISIONS.md.
#
# These are the LIBRARY's ranges (release/v3, 2026-10-09). The exact versions
# every recorded run used live in `uv.lock` — numpy 2.4.6 (in place on the run
# machine since 2026-05-29) and sqlite-vec 0.1.9 (since 2026-07-21) — and
# `uv sync --locked` reproduces that environment. Both sit on the embed path
# (numpy does the unit-normalization arithmetic on every vector; sqlite-vec
# computes every L2 distance behind search and the dedup probe), so a reader
# reproducing a number installs from the lockfile, not from these ranges.
# The `[embed]` and `[extract]` extras below stay pinned EXACTLY: those pins
# are what a recorded store's `memory_meta` names.
dependencies = [
    "sqlite-vec>=0.1.9,<0.2",
    "numpy>=2.4,<3",
]

[project.optional-dependencies]
# The real embedder (BAAI/bge-small-en-v1.5 via ONNX). Optional so the core
# stays sqlite-vec + numpy; CI and the default import path use HashingEmbedder.
#
# onnxruntime is pinned EXACTLY, unlike every other entry in this file. It is the
# float kernel that produces the vectors: a different build can reorder
# reductions or select a different fused op, which moves an embedding, which
# moves a cosine, which moves what the 0.95 dedup screen accepts — and the
# evidence that threshold was selected on cannot be regenerated (CLAUDE.md).
# 1.28.0 is the version installed when every recorded run was produced, so it is
# the version those artifacts describe. Bumping it is a re-ingest decision, not a
# dependency refresh.
# tokenizers is pinned for the same reason: it decides the token IDs the ONNX
# kernel sees, so a tokenization change moves every vector as surely as a kernel
# change does. huggingface-hub stays ranged on purpose — it only downloads the
# revision-pinned model bytes and touches no numeric path.
embed = [
    "onnxruntime==1.28.0",
    "tokenizers==0.23.1",
    "huggingface-hub>=0.25",
]
# The eval harness (python -m evals) is NOT part of the library. These deps are
# only needed to run benchmarks, never to use mnimi.
eval = [
    "huggingface-hub>=0.25",
    "ollama>=0.4",
    "openai>=1.50",
    "python-dotenv>=1.0",
]
# The write-time extractor (SPEC §Extraction; PHASE2 D7). Optional so the core
# stays sqlite-vec + numpy: without it the library runs the v1 write path and
# makes no fact records. llama-cpp-python is pinned EXACTLY: it vendors one
# llama.cpp commit, and llama.cpp logits are not bit-identical across builds,
# so the version string is part of `extractor_runtime` in memory_meta and in
# the pins. Built from source with CUDA 13.2 on the run machine — the recipe
# and the measured throughput are in docs/DECISIONS.md "Extractor runtime".
# huggingface-hub only downloads the revision-pinned GGUF bytes.
extract = [
    "llama-cpp-python==0.3.35",
    "huggingface-hub>=0.25",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/IasonasKokkalos/mnimi"
Repository = "https://github.com/IasonasKokkalos/mnimi"
Issues = "https://github.com/IasonasKokkalos/mnimi/issues"
# The arXiv id lands on preprint day (MERGED-PLAN T10); until then a placeholder.
Paper = "https://arxiv.org/abs/TBA"

[project.scripts]
# The command line is the sibling package `mnimi_cli` (MERGED-PLAN T2): the same
# wheel, a consumer of the public API, never a change to the frozen library.
mnimi = "mnimi_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mnimi", "src/mnimi_cli"]

[tool.uv]
# The run environment's versions of the eval stack (PHASE8 D7, PLAN A7): every
# recorded run was produced with these (read from the system Python on
# 2026-09-26). The four exact pins in the extras already fix the numeric path;
# these fix the transports, so `uv.lock` reproduces the environment and its
# sha256 is the manifest's `environment.lockfile_hash`.
constraint-dependencies = [
    "openai==2.44.0",
    "ollama==0.6.2",
    "python-dotenv==1.2.2",
    "huggingface-hub==1.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# evals/ is a separate harness; lint it too but keep src as the source of truth.
src = ["src", "evals", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "bge: needs the [embed] extra and a ~130MB model download; skipped in CI",
    "extract: needs the [extract] extra, a 1.8GB model download and a GPU; skipped in CI",
]
# Put the repo root on sys.path so tests can import the top-level `evals` package
# (the library lives under src/ and is installed editable; evals is run in place).
pythonpath = ["."]
