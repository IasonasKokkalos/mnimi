# Publish to PyPI through trusted publishing (OIDC, no API token in the repo).
#
# Two projects, two tag prefixes, one job each:
#   v*      -> mnimi      (the library + mnimi_cli, built from the repo root)
#   mcp-v*  -> mnimi-mcp  (integrations/mcp; published minutes after mnimi, since it depends on it)
#
# The PyPI side is one "pending publisher" per project (created by the maintainer before the
# first tag), each naming: owner IasonasKokkalos, repository mnimi, workflow publish.yml,
# environment pypi. A manual run (workflow_dispatch) with repository=testpypi is the dry run;
# it needs the same two publishers registered on test.pypi.org.
name: Publish

on:
  push:
    tags:
      - "v*"
      - "mcp-v*"
  workflow_dispatch:
    inputs:
      project:
        description: "which project to build"
        required: true
        type: choice
        options: [mnimi, mnimi-mcp]
      repository:
        description: "where to upload"
        required: true
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  mnimi:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.project == 'mnimi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # the OIDC token trusted publishing exchanges for an upload token
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist .
      - name: The tag must match pyproject's version
        if: github.event_name == 'push'
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "refs/tags/v$VERSION" = "$GITHUB_REF" || { echo "tag $GITHUB_REF != v$VERSION"; exit 1; }
      - name: Publish to PyPI
        if: github.event_name == 'push' || inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1 at v1.14.2, 2026-10-10
      - name: Publish to TestPyPI (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1 at v1.14.2, 2026-10-10
        with:
          repository-url: https://test.pypi.org/legacy/

  mnimi-mcp:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mcp-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.project == 'mnimi-mcp')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist integrations/mcp
      - name: The tag must match the package version
        if: github.event_name == 'push'
        run: |
          VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('integrations/mcp/src/mnimi_mcp/__init__.py').read()).group(1))")
          test "refs/tags/mcp-v$VERSION" = "$GITHUB_REF" || { echo "tag $GITHUB_REF != mcp-v$VERSION"; exit 1; }
      - name: Publish to PyPI
        if: github.event_name == 'push' || inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1 at v1.14.2, 2026-10-10
      - name: Publish to TestPyPI (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1 at v1.14.2, 2026-10-10
        with:
          repository-url: https://test.pypi.org/legacy/
